<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Triva AI - Asisten Perjalanan Pribadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="bot-info">
        <div class="avatar-wrapper">
          <div class="avatar-glow"></div>
          <div class="bot-avatar">✈️</div>
          <span class="status-indicator"></span>
        </div>
        <div class="bot-details">
          <h1 class="bot-name">Triva AI <span class="badge">Travel Specialist</span></h1>
          <p class="bot-status"><span class="status-dot"></span> Online • Siap merancang liburan impian Anda</p>
        </div>
      </div>
      <button id="reset-btn" class="reset-button" type="button" title="Mulai Obrolan Baru">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M3 21v-5h5"/>
        </svg>
        <span>Reset</span>
      </button>
    </header>

    <!-- Chat Box -->
    <div id="chat-box" class="chat-box"></div>

    <!-- Quick Suggestions -->
    <div id="suggestions" class="suggestions-container">
      <span class="suggestion-label">Rekomendasi Liburan:</span>
      <div class="suggestion-chips">
        <button type="button" class="chip" data-text="Buatkan itinerary liburan ke Bali 4 hari 3 malam untuk 2 orang">🏝️ 4D3N di Bali</button>
        <button type="button" class="chip" data-text="Rekomendasikan destinasi wisata seru & hidden gem di Yogyakarta 3 hari">🏛️ Hidden Gem Jogja</button>
        <button type="button" class="chip" data-text="Rencanakan liburan petualangan ke Labuan Bajo 3 hari 2 malam">⛵ Adventure Labuan Bajo</button>
        <button type="button" class="chip" data-text="Berapa estimasi budget dan itinerary santai ke Bandung 2 hari 1 malam?">☕ Weekend di Bandung</button>
      </div>
    </div>

    <!-- Input Form -->
    <form id="chat-form">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Tanya rencana liburan, kota tujuan, durasi, atau itinerary..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="send-btn" aria-label="Kirim Pesan">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </form>
    
    <footer class="chat-footer">
      <span>Didukung oleh Google Gemini • Khusus konsultasi travel & itinerary</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
